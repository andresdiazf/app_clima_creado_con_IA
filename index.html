<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clima App</title>

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">

  <!-- Estilos -->
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/weather-card.css">
  <link rel="stylesheet" href="styles/forecast.css">
</head>
<body>

<div class="container">

  <header class="header">
    <p class="header-label">Open-Meteo · Sin API key</p>
    <h1 class="header-title">El <em>clima</em><br>de hoy</h1>
  </header>

  <!-- Búsqueda -->
  <div class="search-wrap">
    <input
      class="search-input"
      id="city-input"
      type="text"
      placeholder="Escribe una ciudad..."
      autocomplete="off"
    />
    <button class="search-btn" id="search-btn" aria-label="Buscar">
      <svg viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7"/>
        <line x1="16.5" y1="16.5" x2="22" y2="22"/>
      </svg>
    </button>
  </div>

  <!-- Ciudades recientes -->
  <div id="recent-cities"></div>

  <!-- Mensaje de error -->
  <div class="error" id="error-msg"></div>

  <!-- Spinner -->
  <div class="loader" id="loader">
    <div class="dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- Tarjeta de resultado -->
  <div class="card" id="weather-card">
    <div class="card-top">
      <div class="city-name" id="city-display">—</div>
      <div class="city-coords" id="city-coords">—</div>
    </div>
    <div class="temp-block">
      <div>
        <div class="temp-icon" id="weather-icon">—</div>
        <span class="temp-main" id="temp-value">—</span>
        <span class="temp-unit">°C</span>
      </div>
      <div class="temp-desc" id="weather-desc">—</div>
    </div>
    <div class="stats-grid">
      <div class="stat">
        <div class="stat-label">Sensación térmica</div>
        <div class="stat-value" id="feels-like">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Humedad</div>
        <div class="stat-value" id="humidity">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Viento</div>
        <div class="stat-value" id="wind">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Precipitación</div>
        <div class="stat-value" id="precipitation">—</div>
      </div>
    </div>
  </div>

  <!-- Pronóstico de 7 días -->
  <div class="forecast-section" id="forecast-section">
    <h2 class="forecast-title">📅 Pronóstico de 7 días</h2>
    <div class="forecast-container" id="forecast-container"></div>
  </div>

  <p class="footer-note">Datos: open-meteo.com · Actualizado en tiempo real</p>

</div>

<!-- type="module" habilita los import/export de ES Modules -->
<script type="module" src="src/app.js"></script>

</body>
</html>
